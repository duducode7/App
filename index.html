<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>C6 Yellow</title>
</head>

<body>

    <div class="flex">
        <div class="nome">
            <h3 class="semititulo">Olá,</h3>
            <h1 class="titulo"> Eduardo</h1>
        </div>
        <div class="fotos">
            <img src="Imagens/olho.png">

            <div class="dois">
                <img class=imagem src="Imagens/pessoa.png">
            </div>
        </div>
    </div>

    <div class="saldo">
        <div class="flex">
            <img class=brasil src="Imagens/brazil.webp">
            <h3>Conta Corrente</h3>
        </div>
        <h3 class="saldoES">Saldo em Reais</h3>
        <div class="flex">
            <h3 class="dinheiro">R$</h3>
            <h3 class="ponto">.....</h3>
        </div>
    </div>

    <div class="flex-gap">
        <div class="btn-transferir">
            <div class="btn-imagem">
                <button type="button" class="botao"><img src="Imagens/trans.png"></button>
            </div>
            <div class="btn-txt">
                <p>Tranferir</p>
            </div>
        </div>
        <div class="btn-transferir">
            <div class="btn-imagem">
                <button type="button" class="botao"><img class=botoes src="Imagens/extrato.png"></button>
            </div>
            <div class="btn-txt">
                <p>Extrato</p>
            </div>
        </div>
        <div class="btn-transferir">
            <div class="btn-imagem">
                <button type="button" class="botao"><img class=botoes src="Imagens/cartao.png"></button>
            </div>
            <div class="btn-txt">
                <p>Cartão</p>
            </div>
        </div>
        <div class="btn-transferir">
            <div class="btn-imagem">
                <button type="button" class="botao"><img class=botoes src="Imagens/investir.png"></button>
            </div>
            <div class="btn-txt">
                <p>Investir</p>
            </div>
        </div>
        <div class="btn-transferir">
            <div class="btn-imagem">
                <button type="button" class="botao"><img class=botoes src="Imagens/qrcode.png"></button>
            </div>
            <div class="btn-txt">
                <p>Pagar</p>
            </div>
        </div>
    </div>
